events {
    worker_connections 1024;
}

http {
    # Configuración de proxy CORS para servicios backend en GCP

    # Aumentar límite de tamaño de archivo a 100MB
    client_max_body_size 100M;

    server {
        listen 8080;
        server_name localhost;

        # Headers CORS para todas las respuestas
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 3600 always;

        # Manejar peticiones OPTIONS (preflight)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Proxy para Document Processor
        location /document-processor/ {
            proxy_pass https://rag-document-processor-117511395113.us-central1.run.app/;
            proxy_set_header Host rag-document-processor-117511395113.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts largos para uploads
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # Proxy para RAG Backend
        location /rag-backend/ {
            proxy_pass https://rag-agent-backend-117511395113.us-central1.run.app/;
            proxy_set_header Host rag-agent-backend-117511395113.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
